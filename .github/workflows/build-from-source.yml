name: Build Silver Manager from mirrored source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-from-source.yml'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure production frontend
        working-directory: app-src
        run: |
          cat > .env.production <<'EOF'
          VITE_SUPABASE_URL=https://hkazzmoeowonqwqpngrp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_1T_6Vto_nKVrq1bh08Nhaw_Y72kzct1
          VITE_SYNC_ENDPOINT=https://hkazzmoeowonqwqpngrp.supabase.co/functions/v1/silver-sync
          VITE_ASSISTANT_ENDPOINT=https://hkazzmoeowonqwqpngrp.supabase.co/functions/v1/silver-assistant
          EOF

      - name: Build verified mirrored source
        working-directory: app-src
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build

      - name: Publish build into live root
        run: |
          set -euo pipefail
          rm -rf assets
          rm -f index.html manifest.webmanifest registerSW.js sw.js icon.svg silver-logo.svg .nojekyll
          rm -f workbox-*.js
          cp -R app-src/dist/. .
          touch .nojekyll

          cat > registerSW.js <<'EOF'
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
              try {
                const reg = await navigator.serviceWorker.register('./sw.js', {
                  scope: './',
                  updateViaCache: 'none'
                });
                await reg.update();

                let reloading = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                  if (reloading) return;
                  reloading = true;
                  window.location.reload();
                });
              } catch (err) {
                console.error('Service worker registration failed', err);
              }
            });
          }
          EOF

      - name: Commit production build
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!app-src/node_modules' ':!app-src/.env.production'
          if git diff --cached --quiet; then
            echo "No production changes to publish"
            exit 0
          fi
          git commit -m "deploy: rebuild Silver Manager from mirrored source"
          git push origin main
