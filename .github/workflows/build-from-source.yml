name: Build Silver Manager from source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-from-source.yml'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout Silver Manager source
        uses: actions/checkout@v4
        with:
          repository: wwwshadiredan-collab/silver-manage
          ref: main
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build verified source
        working-directory: source
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build

      - name: Publish build into site repository
        run: |
          set -euo pipefail
          find site -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -R source/dist/. site/
          touch site/.nojekyll

          cat > site/registerSW.js <<'EOF'
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
              try {
                const reg = await navigator.serviceWorker.register('./sw.js', {
                  scope: './',
                  updateViaCache: 'none'
                });
                await reg.update();

                let reloading = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                  if (reloading) return;
                  reloading = true;
                  window.location.reload();
                });
              } catch (err) {
                console.error('Service worker registration failed', err);
              }
            });
          }
          EOF

      - name: Commit production build
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No production changes to publish"
            exit 0
          fi
          git commit -m "deploy: rebuild Silver Manager from source"
          git push origin main
